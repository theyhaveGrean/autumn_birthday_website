<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autumn Notes</title><style>
:root{--ink:#2d2925;--muted:#756c63;--paper:#fbf8f2;--rust:#b7563e;--gold:#d99b3d;--line:#e8ded0}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#efe8dd;font-family:Georgia,'Times New Roman',serif}.shell{min-height:100vh;padding:28px 18px 54px;background:radial-gradient(circle at 10% 0%,#fff9ef 0,transparent 31%),linear-gradient(135deg,#f0e8db,#e9ddd0)}.card{max-width:1060px;margin:auto;background:var(--paper);border:1px solid #decfbd;box-shadow:0 22px 55px #573a1c22}header{padding:50px 8vw 42px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font:700 11px Arial;color:var(--rust)}h1{font-size:clamp(42px,7vw,78px);line-height:.94;font-weight:400;margin:14px 0 12px;letter-spacing:-.045em}.intro{color:var(--muted);font-size:18px;max-width:490px;line-height:1.55;margin:0}.leaf{color:var(--gold);font-size:62px;transform:rotate(-25deg)}main{display:grid;grid-template-columns:minmax(260px,.8fr) 1.2fr}section{padding:42px 8vw}.form-panel{border-right:1px solid var(--line)}h2{font-size:28px;font-weight:400;margin:0 0 8px}.sub{color:var(--muted);line-height:1.5;margin:0 0 25px}label{display:block;font:700 11px Arial;text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}input,textarea{width:100%;border:1px solid #d8c9b8;background:#fffdf9;padding:13px 14px;font:16px Georgia;color:var(--ink);border-radius:2px;outline:none}input:focus,textarea:focus{border-color:var(--rust);box-shadow:0 0 0 3px #b7563e1a}textarea{resize:vertical;min-height:130px}button{border:0;background:var(--rust);color:#fffaf3;padding:14px 22px;font:700 12px Arial;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;margin-top:20px}button:hover{background:#92442f}.status{min-height:20px;color:var(--rust);font:13px Arial;margin-top:13px}.notes-panel{background:#fffdf9}.notes-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}.count{color:var(--muted);font:12px Arial}.note{padding:20px 0;border-top:1px solid var(--line)}.note:first-child{border-top:0;padding-top:0}.note-name{font-size:20px;margin-bottom:6px}.note-message{color:#5e554c;line-height:1.6;white-space:pre-wrap}.note-date{color:#a09589;font:11px Arial;margin-top:11px;text-transform:uppercase;letter-spacing:.08em}.empty{color:var(--muted);padding:26px 0;line-height:1.6}footer{padding:18px 8vw;border-top:1px solid var(--line);color:#9a8d7e;font:11px Arial;letter-spacing:.06em;text-transform:uppercase}@media(max-width:720px){header{padding:38px 25px 32px}.leaf{display:none}main{grid-template-columns:1fr}section{padding:34px 25px}.form-panel{border-right:0;border-bottom:1px solid var(--line)}footer{padding:18px 25px}}
</style></head><body><div class="shell"><div class="card"><header><div><div class="eyebrow">A little place to leave a note</div><h1>Autumn<br>Notes</h1><p class="intro">A shared corner for kind words, memories, and messages worth keeping.</p></div><div class="leaf">✦</div></header><main><section class="form-panel"><h2>Leave a note</h2><p class="sub">Say hello. Your message will appear here for everyone to enjoy.</p><form id="note-form"><label for="name">Your name</label><input id="name" name="name" maxlength="60" required placeholder="e.g. Jamie"><label for="message">Your message</label><textarea id="message" name="message" maxlength="1000" required placeholder="Write something lovely…"></textarea><button type="submit">Post message</button><div class="status" id="status" role="status"></div></form></section><section class="notes-panel"><div class="notes-head"><h2>From the guestbook</h2><span class="count" id="count"></span></div><div id="notes"><div class="empty">Loading the guestbook…</div></div></section></main><footer>Public guestbook · made for sharing</footer></div></div><script>
const notesEl=document.querySelector('#notes'),countEl=document.querySelector('#count'),statusEl=document.querySelector('#status'),form=document.querySelector('#note-form');const esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(a){countEl.textContent=`${a.length} ${a.length===1?'note':'notes'}`;notesEl.innerHTML=a.length?a.map(n=>`<article class="note"><div class="note-name">${esc(n.name)}</div><div class="note-message">${esc(n.message)}</div><div class="note-date">${new Date(n.created_at).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div></article>`).join(''):'<div class="empty">No notes yet. Be the first to leave one.</div>'}async function load(){try{const r=await fetch('/api/notes');if(!r.ok)throw Error();render(await r.json())}catch(e){render(JSON.parse(localStorage.getItem('autumn-notes')||'[]'))}}form.addEventListener('submit',async e=>{e.preventDefault();statusEl.textContent='Posting…';const d={name:form.name.value.trim(),message:form.message.value.trim()};try{const r=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error();form.reset();statusEl.textContent='Your note is posted.';load()}catch(e){const a=JSON.parse(localStorage.getItem('autumn-notes')||'[]');a.unshift({...d,created_at:new Date().toISOString()});localStorage.setItem('autumn-notes',JSON.stringify(a));form.reset();statusEl.textContent='Saved on this device (server unavailable).';render(a)}});load();</script></body></html>
