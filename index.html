<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Autumn Notes // Send</title><style>:root{--g:#61ff75;--d:#39a948;--b:#061009}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--g);font:16px 'Courier New',monospace}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#fff0 0 3px,#61ff7508 4px)}.box{max-width:620px;margin:8vh auto;padding:35px;border:1px solid var(--d);box-shadow:0 0 35px #39a94833;background:#07150b}.gate{text-align:center}.hidden{display:none}h1{font-size:clamp(34px,8vw,64px);text-shadow:0 0 12px var(--g)}.prompt{color:var(--d)}p{line-height:1.5}input,textarea{display:block;width:100%;padding:14px;margin:10px 0 20px;background:#020703;color:var(--g);border:1px solid var(--d);font:inherit}textarea{min-height:150px}button{padding:14px 20px;background:var(--g);color:#061009;border:0;font:bold 13px 'Courier New';cursor:pointer}.error{height:20px;color:#ff6b6b;margin-top:12px}label{color:var(--d)}@media(max-width:680px){.box{margin:0;min-height:100vh;border-width:0;padding:25px}}
</style></head><body><main class=box><section id=gate class=gate><div class=prompt>[ SYSTEM ] PRIVATE TRANSMITTER</div><h1>ACCESS REQUIRED</h1><p>ENTER PIN TO CONTINUE_</p><form id=pinform><input id=pin type=password inputmode=numeric maxlength=4 autocomplete=off required><button>AUTHENTICATE</button><div id=err class=error></div></form></section><section id=app class="hidden"><div class=prompt>guestbook://autumn-notes/send-only</div><h1>SEND_MESSAGE()</h1><p>Messages are transmitted to the database. This interface never reads or displays previous messages.</p><form id=form><label>NAME</label><input id=name maxlength=60 required><label>MESSAGE</label><textarea id=message maxlength=1000 required></textarea><button>TRANSMIT</button><p id=status></p></form></section></main><script>const URL='https://rrwyqfddvijgimcslqkl.supabase.co/rest/v1/notes',KEY='sb_publishable_2Iurrigf7zF0by-BWoKE3g_IAT76514',HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};pinform.onsubmit=e=>{e.preventDefault();if(pin.value==='4008'){gate.className='hidden';app.className='';}else err.textContent='ACCESS DENIED_'};form.onsubmit=async e=>{e.preventDefault();status.textContent='TRANSMITTING...';try{const r=await fetch(URL,{method:'POST',headers:{...HEAD,Prefer:'return=minimal'},body:JSON.stringify({name:name.value.trim(),message:message.value.trim()})});if(!r.ok)throw Error(r.status);form.reset();status.textContent='MESSAGE SENT_'}catch(x){status.textContent='TRANSMISSION FAILED: '+x.message}}</script></body></html>
