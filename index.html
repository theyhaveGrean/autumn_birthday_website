<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Autumn Notes // Terminal</title><style>:root{--g:#61ff75;--dim:#39a948;--bg:#061009}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--g);font:16px 'Courier New',monospace}body:before{content:'';pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(0deg,#fff0 0 3px,#61ff7507 4px);z-index:5}.box{max-width:900px;margin:5vh auto;padding:28px;border:1px solid var(--dim);box-shadow:0 0 35px #39a94833;background:#07150b}.prompt{color:var(--dim)}h1{font-size:clamp(30px,7vw,66px);margin:12px 0;text-shadow:0 0 12px var(--g)}h2{font-size:20px}.gate{text-align:center;padding:10vh 20px}.gate input,.gate button{display:block;margin:15px auto;width:min(300px,100%)}input,textarea{width:100%;padding:13px;background:#020703;color:var(--g);border:1px solid var(--dim);font:inherit;outline:0}textarea{min-height:125px}button{padding:13px 18px;background:var(--g);color:#061009;border:0;font:bold 13px 'Courier New';cursor:pointer}button:hover{box-shadow:0 0 15px var(--g)}.error{height:20px;color:#ff6b6b}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:35px;border-top:1px solid var(--dim);padding-top:25px}.note{border-top:1px solid var(--dim);padding:15px 0}.note:first-child{border-top:0}.msg{white-space:pre-wrap;color:#b8ffc0}.date{color:var(--dim);font-size:12px;margin-top:8px}@media(max-width:700px){.box{margin:0;border-width:0 0 1px}.grid{display:block}.panel{margin-bottom:35px}}</style></head><body><main class=box><section id=gate class=gate><div class=prompt>[ SYSTEM ] PRIVATE GUESTBOOK</div><h1>ACCESS REQUIRED</h1><p>ENTER PIN TO CONTINUE_</p><form id=pinform><input id=pin type=password inputmode=numeric maxlength=4 autocomplete=off required><button>AUTHENTICATE</button><div id=err class=error></div></form></section><section id=app class=hidden><div class=prompt>guestbook://autumn-notes</div><h1>AUTUMN_NOTES</h1><div class=grid><div class=panel><h2>/* LEAVE A MESSAGE */</h2><form id=form><label>NAME</label><input id=name maxlength=60 required><label>MESSAGE</label><textarea id=message maxlength=1000 required></textarea><button>POST_MESSAGE()</button><p id=status></p></form></div><div class=panel><h2>/* PUBLIC LOG */</h2><div id=notes>Loading...</div></div></div></section></main><script>const URL='https://rrwyqfddvijgimcslqkl.supabase.co/rest/v1/notes',KEY='sb_publishable_2Iurrigf7zF0by-BWoKE3g_IAT76514',HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},safe=x=>x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch(URL+'?select=name,message,created_at&order=created_at.desc',{headers:HEAD});if(!r.ok)throw Error(r.status);const a=await r.json();notes.innerHTML=a.map(x=>`<article class=note><b>&gt; ${safe(x.name)}</b><div class=msg>${safe(x.message)}</div><div class=date>${new Date(x.created_at).toISOString()}</div></article>`).join('')||'NO RECORDS FOUND_'}pinform.onsubmit=async e=>{e.preventDefault();if(pin.value!=='4008'){err.textContent='ACCESS DENIED_';return}gate.classList.add('hidden');app.classList.remove('hidden');try{await load()}catch(x){notes.textContent='DATABASE CONNECTION ERROR_'}};form.onsubmit=async e=>{e.preventDefault();status.textContent='TRANSMITTING...';const r=await fetch(URL,{method:'POST',headers:{...HEAD,Prefer:'return=minimal'},body:JSON.stringify({name:name.value.trim(),message:message.value.trim()})});status.textContent=r.ok?'MESSAGE STORED_':'WRITE FAILED_';if(r.ok){form.reset();load()}}</script></body></html>
