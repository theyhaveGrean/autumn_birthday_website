<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome Home</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#efe8dd;color:#2d2925;font-family:Georgia,serif}.card{background:#fbf8f2;padding:45px 35px;text-align:center;width:min(330px,calc(100% - 40px));box-shadow:0 22px 55px #573a1c22}.eyebrow{font:700 11px Arial;text-transform:uppercase;letter-spacing:.16em;color:#b7563e}h1{font-size:48px;font-weight:400;margin:15px 0}p{color:#756c63;line-height:1.5}input{width:100%;box-sizing:border-box;padding:14px;text-align:center;letter-spacing:.4em;font-size:20px;border:1px solid #d8c9b8;background:#fffdf9}button{width:100%;border:0;background:#b7563e;color:white;padding:15px;margin-top:18px;font:700 12px Arial;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}.error{height:20px;color:#b7563e;font:12px Arial;margin-top:10px}</style></head><body><div class="card"><div class="eyebrow">Welcome home</div><h1>Autumn Notes</h1><p>Enter the PIN to open the guestbook.</p><form id="f"><input id="p" type="password" maxlength="4" inputmode="numeric" placeholder="••••" required><button>Enter guestbook</button><div class="error" id="e"></div></form></div><script>document.querySelector('#f').addEventListener('submit',e=>{e.preventDefault();if(document.querySelector('#p').value==='4008')location.href='index.html';else document.querySelector('#e').textContent='That PIN is not quite right.'})</script></body></html>
